name: Django checks

on:
  pull_request:
  push:
    branches: [main, portfolio/construction]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Qurilish_project-main
    env:
      DJANGO_SECRET_KEY: test-only-ci-key-for-construction-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: python manage.py spectacular --file /tmp/construction-schema.yml --validate --fail-on-warn
